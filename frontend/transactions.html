<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions - Budget Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
    <div class="nav-brand">
        <span class="brand-income">Budget</span><span class="brand-expense">Tracker</span>
    </div>
    <a href="index.html" class="active">Dashboard</a>
    <a href="transactions.html">Transactions</a>
    <a href="categories.html">Categories</a>
</nav>

<main>
    <h1>Transactions</h1>

    <section class="filters">
        <select id="filter-type">
            <option value="">All Types</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
        </select>
        <input type="date" id="filter-date">
        <button id="btn-filter">Filter</button>
        <button id="btn-clear">Clear</button>
    </section>

    <section class="list-section">
        <h2>All Transactions</h2>
        <table>
            <thead>
            <tr>
                <th>Date</th>
                <th>Description</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="transactions-body">
            <tr>
                <td colspan="5">Loading...</td>
            </tr>
            </tbody>
        </table>
    </section>

    <section class="form-section">
        <h2 id="form-title">Add Transaction</h2>
        <form id="transaction-form">
            <input type="hidden" id="transaction-id">

            <div class="form-group">
                <label for="amount">Amount (€)</label>
                <input type="number" id="amount" min="0.01" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" id="description" maxlength="100">
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" required>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" required>
                    <option value="">Select a category</option>
                </select>
            </div>

            <div class="form-buttons">
                <button type="submit" id="btn-submit">Add Transaction</button>
                <button type="button" id="btn-cancel" class="hidden">Cancel</button>
            </div>
        </form>
    </section>

</main>

<script type="module" src="js/transactions.js"></script>

</body>
</html>
