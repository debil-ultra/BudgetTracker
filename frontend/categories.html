<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - Budget Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
    <div class="nav-brand">
        <span class="brand-income">Budget</span><span class="brand-expense">Tracker</span>
    </div>
    <a href="index.html" class="active">Dashboard</a>
    <a href="transactions.html">Transactions</a>
    <a href="budgets.html">Budgets</a>
    <a href="categories.html">Categories</a>
</nav>

<main>
    <h1>Categories</h1>

    <section class="form-section">
        <h2 id="form-title">Add Category</h2>
        <form id="category-form">
            <input type="hidden" id="category-id">

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" maxlength="50" required>
            </div>

            <div class="form-group">
                <label for="type">Type</label>
                <select id="type" required>
                    <option value="">Select a type</option>
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>
            </div>

            <div class="form-buttons">
                <button type="submit" id="btn-submit">Add Category</button>
                <button type="button" id="btn-cancel" class="hidden">Cancel</button>
            </div>
        </form>
    </section>

    <section class="list-section">
        <h2>Income Categories</h2>
        <table>
            <thead>
            <tr>
                <th>Name</th>
                <th>Type</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="income-categories-body">
            <tr>
                <td colspan="3">Loading...</td>
            </tr>
            </tbody>
        </table>

        <h2>Expense Categories</h2>
        <table>
            <thead>
            <tr>
                <th>Name</th>
                <th>Type</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="expense-categories-body">
            <tr>
                <td colspan="3">Loading...</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>

<script type="module" src="js/categories.js"></script>

</body>
</html>
